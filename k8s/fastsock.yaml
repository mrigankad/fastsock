apiVersion: v1
kind: Namespace
metadata:
  name: fastsock
---
# -------------------------------------------------------
# ConfigMap — shared, non-secret configuration
# -------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: fastsock-config
  namespace: fastsock
data:
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/fastsock"
  REDIS_URL: "redis://redis:6379/0"
  ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
  LOG_FORMAT: "json"
---
# -------------------------------------------------------
# Secret — sensitive values (replace in production!)
# -------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: fastsock-secrets
  namespace: fastsock
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_ME_TO_A_STRONG_RANDOM_KEY"
  POSTGRES_PASSWORD: "postgres"
---
# -------------------------------------------------------
# PostgreSQL Deployment + Service
# -------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fastsock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fastsock-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "fastsock"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: fastsock
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fastsock
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# -------------------------------------------------------
# Redis Deployment + Service
# -------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fastsock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fastsock
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# -------------------------------------------------------
# Backend Deployment + Service
# -------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fastsock
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: fastsock-backend:latest  # Replace with your registry image
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: fastsock-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fastsock-secrets
                  key: SECRET_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: fastsock
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
# -------------------------------------------------------
# Frontend Deployment + Service
# -------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fastsock
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: fastsock-frontend:latest  # Replace with your registry image
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fastsock
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
# -------------------------------------------------------
# Ingress — route traffic to frontend and backend
# -------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastsock-ingress
  namespace: fastsock
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "backend"
spec:
  ingressClassName: nginx
  rules:
    - host: fastsock.example.com  # Replace with your domain
      http:
        paths:
          # API + WebSocket -> backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Everything else -> frontend (SPA)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
